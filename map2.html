<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>

      #map {
       overflow: hidden;
       float: left;
       border: thin solid #333;
       }
#infowindow-content{font-size:26px}

    </style>

    <script>


  function initMap() {
    var dtNow=Date.now();
    console.log('init');
    var strHash=window.location.hash.replace('#','').split('!');
    document.getElementById("title").innerHTML=strHash[1]+' '+decodeURIComponent(strHash[0]).replace(/\+/g, ' ');
    var src = 'https://jakartatomang.github.io/'+strHash[1]+'.jpg';
    if(strHash.length==3)
    {
      var dtExpire=strHash[2];
      if(dtNow>dtExpire){
        console.log('expired')
        document.getElementById('map').innerHTML='Kartu daerah tidak bisa dikerjakan lagi.';
        return;
      }
    }
    document.getElementById('map').innerHTML='<img src='+src+' width=100%>';
  }





  window.addEventListener("hashchange", initMap);
  document.addEventListener("DOMContentLoaded",initMap);

    </script>

  </<head>

    <body>
        <div id="title"></div>
        <div id="map"></div>


      </body>
</html>
