<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>

      #map {
       height: 100vh;
       width: 100vw;
       overflow: hidden;
       float: left;
       border: thin solid #333;
       }
#infowindow-content{font-size:26px}

    </style>

    <script>


  function initMap() {
    var dtNow=Date.now();
    console.log('init');
    var strHash=window.location.hash.replace('#','').split('!');
    document.getElementById("title").innerHTML=strHash[0];
    var src = 'https://jakartatomang.github.io/'+strHash[0]+'.jpg';
    if(strHash.length==2)
    {
      var dtExpire=strHash[1];
      if(dtNow>dtExpire){
        console.log('expired')
        document.getElementById('map').innerHTML='Kartu daerah tidak bisa dikerjakan lagi.';
        return;
      }
    }
    document.getElementById('map').innerHTML='<img src='+src+' height=100%>';
  }





  window.addEventListener("hashchange", initMap);
  document.addEventListener("DOMContentLoaded",initMap);

    </script>

  </<head>

    <body>
        <div id="title"></div>
        <div id="map"></div>


      </body>
</html>
